    <div class="container">
        <h1>The Cloud of Where</h1>
        <p class="description">
            A visualization of the Gaussian wavefunction probability density |ψ(x,y)|²
        </p>

        <div class="equation">
            P(x,y) = |ψ(x,y)|² = (1/√(2πσ²)) × exp(-(x-x₀)²/(2σ²)) × exp(-(y-y₀)²/(2σ²))
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="sigmaX">Width (σ): <span id="sigmaXValue">0.35</span></label>
                <input type="range" id="sigmaX" min="0.1" max="1" step="0.05" value="0.35">
            </div>
            <div class="control-group">
                <label for="voronoi">Voronoi Cells: <span id="voronoiValue">On</span></label>
                <input type="range" id="voronoi" min="0" max="1" step="1" value="1">
            </div>
            <div class="control-group">
                <label for="resolution">Detail Level: <span id="resolutionValue">High</span></label>
                <input type="range" id="resolution" min="1" max="3" step="1" value="2">
            </div>
            <button onclick="resetView()">Reset</button>
        </div>

        <div style="display: flex; justify-content: center;">
            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
                <div class="colorbar">
                    <div class="colorbar-gradient"></div>
                    <div class="colorbar-label">|ψ|²</div>
                </div>
            </div>
        </div>

        <div class="footer">
            Rendered in real-time using Canvas API. The brightness represents probability density.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Canvas settings
        const canvasSize = 600;
        canvas.width = canvasSize;
        canvas.height = canvasSize;

        // UI Controls
        const sigmaXSlider = document.getElementById('sigmaX');
        const voronoiSlider = document.getElementById('voronoi');
        const resolutionSlider = document.getElementById('resolution');

        const sigmaXValue = document.getElementById('sigmaXValue');
        const voronoiValue = document.getElementById('voronoiValue');
        const resolutionValue = document.getElementById('resolutionValue');

        // Update display values
        sigmaXSlider.addEventListener('input', (e) => {
            sigmaXValue.textContent = parseFloat(e.target.value).toFixed(2);
            render();
        });

        voronoiSlider.addEventListener('input', (e) => {
            voronoiValue.textContent = e.target.value == 1 ? 'On' : 'Off';
            render();
        });

        resolutionSlider.addEventListener('input', (e) => {
            const levels = ['Low', 'Medium', 'High'];
            resolutionValue.textContent = levels[parseInt(e.target.value) - 1];
            render();
        });

        function getResolution() {
            const level = parseInt(resolutionSlider.value);
            return [300, 500, 800][level - 1];
        }

        // Gaussian function in 1D
        function gaussian1D(x, x0, sigma) {
            return (1 / Math.sqrt(2 * Math.PI * sigma * sigma)) *
                   Math.exp(-((x - x0) * (x - x0)) / (2 * sigma * sigma));
        }

        // 2D Probability density (product of two 1D Gaussians)
        function probabilityDensity(x, y, x0, y0, sigma) {
            return gaussian1D(x, x0, sigma) * gaussian1D(y, y0, sigma);
        }

        // Generate Voronoi points
        function generateVoronoiPoints(count, seed = 42) {
            const points = [];
            // Simple seeded random for reproducibility
            let random = seed;
            for (let i = 0; i < count; i++) {
                random = (random * 9301 + 49297) % 233280;
                const x = (random / 233280) * 4 - 2;
                random = (random * 9301 + 49297) % 233280;
                const y = (random / 233280) * 4 - 2;
                points.push({x, y});
            }
            return points;
        }

        // Distance to nearest Voronoi point
        function distanceToNearestVoronoi(x, y, voronoiPoints) {
            let minDist = Infinity;
            for (let point of voronoiPoints) {
                const dx = x - point.x;
                const dy = y - point.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) minDist = dist;
            }
            return minDist;
        }

        // Color mapping function
        function valueToColor(value) {
            // Clamp value between 0 and 1
            value = Math.max(0, Math.min(1, value));

            // Color palette: indigo -> violet -> white
            let r, g, b;

            if (value < 0.25) {
                // Deep indigo to violet
                const t = value / 0.25;
                r = Math.round(10 + (45 - 10) * t);
                g = Math.round(0 + (13 - 0) * t);
                b = Math.round(26 + (77 - 26) * t);
            } else if (value < 0.5) {
                // Violet to bright violet
                const t = (value - 0.25) / 0.25;
                r = Math.round(45 + (93 - 45) * t);
                g = Math.round(13 + (45 - 13) * t);
                b = Math.round(77 + (143 - 77) * t);
            } else if (value < 0.75) {
                // Bright violet to lighter purple
                const t = (value - 0.5) / 0.25;
                r = Math.round(93 + (157 - 93) * t);
                g = Math.round(45 + (93 - 45) * t);
                b = Math.round(143 + (255 - 143) * t);
            } else {
                // Purple to white
                const t = (value - 0.75) / 0.25;
                r = Math.round(157 + (255 - 157) * t);
                g = Math.round(93 + (253 - 93) * t);
                b = Math.round(255 * 1);
            }

            return `rgb(${r}, ${g}, ${b})`;
        }

        function render() {
            const sigma = parseFloat(sigmaXSlider.value);
            const showVoronoi = parseInt(voronoiSlider.value) === 1;
            const resolution = getResolution();

            const imageData = ctx.createImageData(canvasSize, canvasSize);
            const data = imageData.data;

            // Generate Voronoi points
            const voronoiPoints = generateVoronoiPoints(60);

            // Calculate max probability for normalization
            const centerValue = probabilityDensity(0, 0, 0, 0, sigma);

            // Fill canvas
            for (let py = 0; py < canvasSize; py++) {
                for (let px = 0; px < canvasSize; px++) {
                    // Map pixel to coordinate space (-2 to 2)
                    const x = (px / canvasSize) * 4 - 2;
                    const y = ((canvasSize - py) / canvasSize) * 4 - 2;

                    // Calculate probability density
                    const p = probabilityDensity(x, y, 0, 0, sigma);
                    let normalizedP = p / centerValue;
                    normalizedP = Math.pow(normalizedP, 0.7); // Gamma correction for better visibility

                    // Add Voronoi grid if enabled
                    if (showVoronoi) {
                        const voronoiDist = distanceToNearestVoronoi(x, y, voronoiPoints);
                        const cellBoundary = Math.exp(-Math.pow(voronoiDist * 5, 2)); // Sharp falloff near boundaries
                        normalizedP = Math.max(normalizedP, cellBoundary * 0.15);
                    }

                    normalizedP = Math.min(1, normalizedP);

                    // Get color
                    const color = valueToColor(normalizedP);
                    const rgbMatch = color.match(/\d+/g);
                    const [r, g, b] = rgbMatch.map(Number);

                    // Set pixel
                    const idx = (py * canvasSize + px) * 4;
                    data[idx] = r;      // Red
                    data[idx + 1] = g;  // Green
                    data[idx + 2] = b;  // Blue
                    data[idx + 3] = 255; // Alpha
                }
            }

            ctx.putImageData(imageData, 0, 0);

            // Draw axes
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            const centerX = canvasSize / 2;
            const centerY = canvasSize / 2;
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, canvasSize);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvasSize, centerY);
            ctx.stroke();
        }

        function resetView() {
            sigmaXSlider.value = 0.35;
            voronoiSlider.value = 1;
            resolutionSlider.value = 2;
            sigmaXValue.textContent = '0.35';
            voronoiValue.textContent = 'On';
            resolutionValue.textContent = 'High';
            render();
        }

        // Initial render
        render();
    </script>
